<title>2026-2 학기 상황판</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
:root{
  --paper:#f5f3f2; --surface:#fffefd; --surface-2:#eeeae9; --sunk:#e8e2e0;
  --ink:#1a1618; --ink-2:#4e4649; --ink-3:#807679;
  --line:#e2dbd9; --line-2:#cec5c3;
  --accent:#8c1d33; --accent-ink:#8c1d33; --accent-soft:#f5e4e7;
  --soon:#8a6212; --soon-soft:#f6efdd;
  --calm:#55677a; --calm-soft:#e9edf1;
  --done:#3f6b52;
  --shadow:0 1px 2px rgba(26,22,24,.05), 0 8px 20px -12px rgba(26,22,24,.18);
  --ff-display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --ff-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --c-bd:#2f6b5e; --c-ai:#8a5a1c; --c-dl:#5f4a8c; --c-db:#2a5c86;
  --c-llm:#9c3529; --c-sw:#4d6b26; --c-rs:#7a5236;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141112; --surface:#1c1819; --surface-2:#241f20; --sunk:#100d0e;
    --ink:#ece7e6; --ink-2:#b6abaa; --ink-3:#8b7f80;
    --line:#302a2b; --line-2:#433a3c;
    --accent:#d4657a; --accent-ink:#e08196; --accent-soft:#3a222a;
    --soon:#cba552; --soon-soft:#332a17;
    --calm:#93a7b6; --calm-soft:#1f272d;
    --done:#71a486;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.7);
    --c-bd:#6fbfae; --c-ai:#d6a95e; --c-dl:#a795d8; --c-db:#79b3dd;
    --c-llm:#e08575; --c-sw:#9dc06a; --c-rs:#c79c78;
  }
}
:root[data-theme="dark"]{
  --paper:#141112; --surface:#1c1819; --surface-2:#241f20; --sunk:#100d0e;
  --ink:#ece7e6; --ink-2:#b6abaa; --ink-3:#8b7f80;
  --line:#302a2b; --line-2:#433a3c;
  --accent:#d4657a; --accent-ink:#e08196; --accent-soft:#3a222a;
  --soon:#cba552; --soon-soft:#332a17;
  --calm:#93a7b6; --calm-soft:#1f272d;
  --done:#71a486;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.7);
  --c-bd:#6fbfae; --c-ai:#d6a95e; --c-dl:#a795d8; --c-db:#79b3dd;
  --c-llm:#e08575; --c-sw:#9dc06a; --c-rs:#c79c78;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ff-body); font-weight:400; font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:400}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= 앱 골격 ================= */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);align-items:start}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  padding:26px 0 48px;
}
.main{min-width:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 34px 96px}

/* ---------- 사이드바 ---------- */
.brand{padding:0 20px 18px;border-bottom:1px solid var(--line)}
.brand .yr{font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.18em;color:var(--ink-3)}
.brand .nm{font-family:var(--ff-display);font-weight:700;font-size:19px;line-height:1.25;margin-top:5px}
.brand .wk{font-family:var(--ff-mono);font-size:11.5px;color:var(--accent-ink);margin-top:6px;font-variant-numeric:tabular-nums}
.navgrp{padding:14px 12px 0}
.navgrp + .navgrp{margin-top:2px}
.grphead{
  display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.grphead .cnt{margin-left:auto;font-size:10px;opacity:.8}
.grphead .car{transition:transform .18s;display:inline-block;font-size:9px;color:var(--ink-3)}
.grphead[aria-expanded="false"] .car{transform:rotate(-90deg)}
.navitem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 10px;border-radius:4px;font-size:14px;color:var(--ink-2);
  border-left:2px solid transparent;text-decoration:none;
}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--accent-soft);color:var(--accent-ink);border-left-color:var(--accent);font-weight:500}
.navitem .ico{font-family:var(--ff-mono);font-size:11px;color:var(--ink-3);width:14px;flex:none}
.navitem.on .ico{color:var(--accent-ink)}
.navitem .tail{margin-left:auto;font-family:var(--ff-mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.navitem .tail.hot{color:var(--accent-ink);font-weight:600}
.crow-nav{display:flex;align-items:stretch;gap:0}
.crow-nav .navitem{flex:1;min-width:0}
.crow-nav .navitem .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkbtn{
  width:26px;flex:none;color:var(--ink-3);font-size:9px;border-radius:4px;
  display:grid;place-items:center;
}
.wkbtn:hover{background:var(--surface-2);color:var(--ink)}
.wkbtn .car{display:inline-block;transition:transform .18s}
.wkbtn[aria-expanded="true"] .car{transform:rotate(90deg)}
.wklist{padding:2px 0 8px 30px;display:flex;flex-direction:column;gap:1px}
.wklink{
  display:flex;gap:8px;align-items:baseline;padding:3px 8px;border-radius:3px;
  font-size:12px;color:var(--ink-3);text-align:left;width:100%;
}
.wklink:hover{background:var(--surface-2);color:var(--ink-2)}
.wklink .n{font-family:var(--ff-mono);font-size:10.5px;width:17px;flex:none;font-variant-numeric:tabular-nums}
.wklink .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wklink.cur{color:var(--accent-ink);font-weight:500}
.wklink.cur .n{color:var(--accent-ink)}
.sidefoot{padding:18px 20px 0;margin-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.6}
.sidefoot a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid var(--line-2)}
.menubtn{display:none}

/* ---------- 공통 헤더 ---------- */
.masthead{padding:44px 0 0}
.eyebrow{font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.masthead h1{font-family:var(--ff-display);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.12;letter-spacing:-.01em;margin:10px 0 0}
.masthead h1 em{font-style:normal;color:var(--accent-ink)}
.mast-sub{margin-top:9px;color:var(--ink-2);font-size:14.5px;max-width:62ch}
.rule{height:2px;background:var(--accent);margin:22px 0 0;opacity:.85}

.stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.stat{padding:16px 14px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat .k{font-family:var(--ff-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:500;line-height:1.15;margin-top:6px;letter-spacing:-.02em}
.stat .v small{font-size:12.5px;font-weight:400;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.stat .n{font-size:12px;color:var(--ink-3);margin-top:2px}

section{margin-top:50px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.shead h2{font-family:var(--ff-display);font-weight:700;font-size:22px;letter-spacing:-.005em;display:flex;align-items:baseline;gap:11px}
.shead h2 .idx{font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--accent-ink);transform:translateY(-3px)}
.shead .hint{font-size:12.5px;color:var(--ink-3)}
.shead + *{margin-top:18px}

/* ---------- 주차 패널 · 과제 ---------- */
.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.navbtn{width:30px;height:30px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:.15s;font-family:var(--ff-mono);font-size:13px}
.navbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.navbtn[disabled]{opacity:.32;cursor:default;border-color:var(--line)}
.wlabel{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500}
.wrange{font-family:var(--ff-mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wtag{font-family:var(--ff-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--accent);color:#fff;font-weight:500}
.today-btn{margin-left:auto;font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);border-bottom:1px solid var(--line-2);padding-bottom:1px}
.today-btn:hover{color:var(--accent-ink);border-color:var(--accent)}

.task{display:grid;grid-template-columns:22px 1fr auto;gap:0 14px;align-items:start;padding:14px 16px 14px 14px;background:var(--surface);border:1px solid var(--line);border-top:0}
.tasklist .task:first-child{border-top:1px solid var(--line)}
.task.is-lead{border-left:3px solid var(--accent);padding-left:11px}
.chk{appearance:none;width:16px;height:16px;margin:4px 0 0;border:1.5px solid var(--line-2);border-radius:3px;background:var(--surface);cursor:pointer;transition:.15s;flex:none}
.chk:hover{border-color:var(--accent)}
.chk:checked{background:var(--done);border-color:var(--done)}
.chk:checked::after{content:"";display:block;width:4px;height:8px;margin:1px 0 0 4.5px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(43deg)}
.chk:disabled{cursor:default}
.task .body{min-width:0}
.task .ttl{font-size:15px;font-weight:500;line-height:1.4}
.task .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px}
.crs{font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;text-decoration:none}
a.crs:hover{background:var(--accent-soft);color:var(--accent-ink)}
.kind{font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.task .note{font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.task .note b{font-weight:500;color:var(--accent-ink)}
.due{text-align:right;flex:none;padding-top:1px}
.due .d{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill{display:inline-block;margin-top:5px;font-family:var(--ff-mono);font-size:10.5px;font-weight:600;letter-spacing:.07em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.now{background:var(--accent);color:#fff}
.pill.soon{background:var(--soon-soft);color:var(--soon);box-shadow:inset 0 0 0 1px currentColor}
.pill.calm{background:var(--calm-soft);color:var(--calm)}
.task.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.task.done .pill{background:var(--surface-2);color:var(--ink-3);box-shadow:none}
.empty{padding:24px 20px;border:1px dashed var(--line-2);background:var(--surface);color:var(--ink-3);font-size:14px;text-align:center}
.empty b{display:block;color:var(--ink-2);font-weight:500;margin-bottom:3px}
.task .ttl a.tlink{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.task .ttl a.tlink:hover{color:var(--accent-ink);border-bottom-color:var(--accent)}
.ext{font-family:var(--ff-mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;margin-left:7px;padding:2px 5px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);vertical-align:1.5px;white-space:nowrap}
a.tlink.real .ext{background:var(--accent-soft);color:var(--accent-ink)}
a.tlink:hover .ext{background:var(--accent);color:#fff}

/* ---------- 강의 영상 ---------- */
.vbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.vfilters{display:flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.vf{padding:5px 13px;font-size:12.5px;color:var(--ink-2)}
.vf + .vf{border-left:1px solid var(--line-2)}
.vf:hover{background:var(--surface-2)}
.vf.on,.vf.on:hover{background:var(--accent);color:#fff}
.vprog{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.vprog b{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink)}
.vprog .done{color:var(--done)}
.vprog .asof{font-size:12px}
.vprog .asof b{color:var(--done)}
.wgrp + .wgrp{margin-top:22px}
.wgrp-h{display:flex;align-items:baseline;gap:11px;padding-bottom:7px;border-bottom:1px solid var(--line-2)}
.wgrp-h .wn{font-family:var(--ff-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.wgrp-h .wd{font-family:var(--ff-mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wgrp-h .wc{margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wgrp.late .wgrp-h .wn{color:var(--soon)}
.wgrp.cur .wgrp-h .wn{color:var(--accent-ink)}
.vrow{display:grid;grid-template-columns:22px 1fr auto;gap:0 13px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.vrow .vt{font-size:14px;line-height:1.42;min-width:0}
.vrow .vt .crs{margin-right:8px}
.vrow.seen .vt .lbl{color:var(--ink-3);text-decoration:line-through}
.vlinks{display:flex;gap:6px;align-items:center;flex:none}
.vlang{font-family:var(--ff-mono);font-size:10px;letter-spacing:.04em;padding:3px 8px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.vrow.seen .vlang{opacity:.55}
.vdue{font-family:var(--ff-mono);font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.vdue.live{background:var(--accent-soft);color:var(--accent-ink)}
.vdue.over{background:var(--soon);color:#fff}
.vrow.opt{opacity:.62}
.optbadge{display:inline-block;font-family:var(--ff-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;margin-left:9px;padding:2px 6px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap;vertical-align:1.5px;text-decoration:none}
.vrow.seen .vt .optbadge{text-decoration:none}
.lmsbadge{display:inline-block;font-family:var(--ff-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;margin-left:9px;padding:2px 6px;border-radius:2px;background:var(--done);color:#fff;white-space:nowrap;vertical-align:1.5px}
.vrow.seen .vt .lmsbadge{text-decoration:none}

/* ---------- 겹치는 개념 지도 ---------- */
.c-bd{color:var(--c-bd)} .c-ai{color:var(--c-ai)} .c-dl{color:var(--c-dl)}
.c-db{color:var(--c-db)} .c-llm{color:var(--c-llm)} .c-sw{color:var(--c-sw)} .c-rs{color:var(--c-rs)}
.lede{margin-top:14px;max-width:62ch;font-size:15px;line-height:1.75;color:var(--ink-2)}

.nowgrid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.nowrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.85fr);gap:0;background:var(--surface)}
.nowrow > div{padding:14px 16px;min-width:0}
.nowrow .nl{border-right:1px solid var(--line)}
.nowrow .nl h4{font-family:var(--ff-display);font-weight:700;font-size:16px;line-height:1.35}
.nowrow .nl .src{margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.nowrow .cap{font-family:var(--ff-mono);font-size:10px;letter-spacing:.09em;color:var(--ink-3);display:block;margin:11px 0 7px}

.cmwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
.cmgrid{display:grid;grid-template-columns:minmax(178px,1.4fr) repeat(16,minmax(26px,1fr));min-width:640px}
.cmwk{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-3);text-align:center;padding:8px 0 7px;
  border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.cmwk.now{color:var(--accent-ink);font-weight:600;background:var(--accent-soft)}
.cmcorner{border-bottom:1px solid var(--line-2);position:sticky;left:0;background:var(--surface);z-index:2}
.cmname{position:sticky;left:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line);
  border-right:1px solid var(--line-2);padding:0}
.cmname button{display:block;width:100%;text-align:left;padding:9px 12px;font-size:12.5px;line-height:1.35;color:var(--ink)}
.cmname button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.cmcell{border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:5px 4px;min-height:34px}
.cmcell.now{background:var(--accent-soft)}
.cdot{display:block;height:6px;border-radius:1px;background:currentColor;opacity:.85}
.cdot:hover{opacity:1;transform:scaleY(1.5)}
.cmlegend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.cmlegend span{display:flex;align-items:center;gap:7px}
.cmlegend i{width:14px;height:6px;border-radius:1px;background:currentColor;display:block}

.ccard{border-top:1px solid var(--line-2);padding:26px 0 28px}
.ccard:last-of-type{border-bottom:1px solid var(--line-2)}
.ctop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ckind{font-family:var(--ff-mono);font-size:10px;letter-spacing:.09em;color:var(--ink-3);
  border:1px solid var(--line-2);padding:3px 7px;border-radius:2px}
.ctop h3{font-family:var(--ff-display);font-weight:700;font-size:21px;line-height:1.3}
.cdef{margin-top:11px;max-width:64ch;font-size:14px;line-height:1.72;color:var(--ink-2)}
.chits{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:10px}
.chit{background:var(--surface);border:1px solid var(--line);padding:13px 15px 15px}
.chh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cbadge{font-size:12px;font-weight:600;color:currentColor}
.cwk{font-family:var(--ff-mono);font-size:10.5px;font-weight:500;letter-spacing:.03em;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-2);text-decoration:none;font-variant-numeric:tabular-nums}
.cwk:hover{background:var(--accent);color:#fff}
.chit p{margin-top:9px;font-size:13px;line-height:1.65;color:var(--ink-2)}
.ctip{margin-top:16px;padding:12px 15px;background:var(--accent-soft);font-size:13.5px;line-height:1.6;color:var(--accent-ink)}
.ctip b{font-weight:600;margin-right:8px}

.tcard{border-left:3px solid var(--line-2);padding:2px 0 2px 16px}
.tcard + .tcard{margin-top:20px}
.tcard h4{font-family:var(--ff-display);font-weight:700;font-size:17px}
.tcard .sense{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tcard .sense > div{font-size:13px;line-height:1.6;color:var(--ink-2)}

var DOW=['일','월','화','수','목','금','토'];
var TODAY=new Date(); TODAY.setHours(0,0,0,0);
function ymdStr(d){ var p=function(x){return x<10?'0'+x:''+x}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function days(d){ return Math.round((d-TODAY)/86400000); }
function curWeek(){
  var n=Math.floor((TODAY-W1)/86400000/7)+1;
  return Math.min(NW,Math.max(1,n));
}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')};

/* ===== 강의 영상 (LMS LearningX) ===== */
var DONE={};
(LMS.done||[]).forEach(function(i){ DONE[i]=1; });
var VIDG=(function(){
  var map={},order=[];
  LMS.vids.forEach(function(v){
    var k=v.c+'|'+v.w+'|'+v.t;
    if(!map[k]){ map[k]={key:k,c:v.c,w:v.w,t:v.t,items:[]}; order.push(k); }
    map[k].items.push(v);
  });
  var g=order.map(function(k){ return map[k]; });
  g.forEach(function(x){
    x.lmsDone=x.items.some(function(v){ return DONE[v.i]; });
    /* use_attendance=false → 시청해도 출석에 반영되지 않는 보조 영상 */
    x.opt=x.items.every(function(v){ return v.a===0; });
    x.du=x.items[0].du||'';
    x.sec=x.items.reduce(function(m,v){ return Math.max(m,v.sec||0); },0);
  });
  g.sort(function(a,b){ return a.w-b.w || (a.c<b.c?-1:a.c>b.c?1:0); });
  return g;
})();
function isSeen(g){ return g.lmsDone || g.opt || !!ST.seen[g.key]; }
function vidDueOver(g){ return !!g.du && g.du < ymdStr(TODAY) && !g.lmsDone && !g.opt; }
function vidMin(g){ return g.sec ? Math.round(g.sec/60)+'분' : ''; }
function vidsOf(c,w){ return VIDG.filter(function(g){ return g.c===c && (w?g.w===w:true); }); }
function filesOf(c,w){ return (LMS.files||[]).filter(function(f){ return f.c===c && f.w===w; }); }

/* 과제 ↔ Canvas 과제 매칭 */
var ASGKEY=[
  ['bd','제안서','Proposal submission'],
  ['bd','중간고사','Midterm'],
  ['bd','Final Project 발표','Final Project Presentation'],
  ['bd','Final Project 보고서','Final Project Report Submission']
];
function findAsg(x){
  for(var i=0;i<ASGKEY.length;i++){
    var k=ASGKEY[i];
    if(x.c===k[0] && x.t.indexOf(k[1])>=0){
      for(var j=0;j<LMS.asg.length;j++){
        var a=LMS.asg[j];
        if(a.c===k[0] && a.n.replace(/\s+$/,'')===k[2]) return a;
      }
    }
  }
  return null;
}
function lmsURL(x){
  var id=courseId(x.c); if(!id) return null;
  var a=findAsg(x);
  if(a) return CV+'/courses/'+id+'/assignments/'+a.i;
  return modURL(x.c,x.w);
}
function linkTitle(x){
  var u=lmsURL(x); if(!u) return esc(x.t);
  var real=!!findAsg(x);
  return '<a class="tlink'+(real?' real':'')+'" href="'+u+'" target="_blank" rel="noopener">'+
         esc(x.t)+'<span class="ext">'+(real?'제출 ↗':'강의실 ↗')+'</span></a>';
}
function urgency(d){
  var n=days(d);
  if(n<0) return ['calm','지남'];
  if(n<=3) return ['now', n===0?'오늘':'D-'+n];
  if(n<=7) return ['soon','D-'+n];
  return ['calm','D-'+n];
}
function weekOf(c,w){
  var a=WK[c]||[];
  for(var i=0;i<a.length;i++) if(a[i].w===w) return a[i];
  return null;
}
var SRCLBL={m:['m','자료 확인'],s:['s','계획서 기준'],g:['g','교재 진도 추정']};
function srcBadge(s){
  var v=SRCLBL[s]||SRCLBL.s;
  return '<span class="srcbadge '+v[0]+'">'+v[1]+'</span>';
}

  var root=$(rootSel); if(!root) return;
  var cw=curWeek();
  var pool=VIDG.filter(function(g){ return only?g.c===only:true; });
  var list=pool.filter(function(g){
    if(vidMode==='all') return true;
    if(g.w===cw) return true;
    return g.w<cw && !isSeen(g);
  });
  var h='';
  if(!pool.length){
    h='<div class="empty"><b>등록된 강의 영상 없음</b>이 과목은 아직 Canvas 모듈에 영상이 올라와 있지 않습니다.</div>';
    root.innerHTML=h; return;
  }
  if(!list.length){
    h='<div class="empty"><b>지금 볼 영상 없음</b>'+
      (cw<2?'1주차 영상까지 모두 처리됐습니다. 「전체 '+NW+'주」로 앞으로의 영상을 미리 볼 수 있습니다.'
           :'이번 주까지의 강의 영상을 모두 시청했습니다.')+'</div>';
  }else{
    var prev=null;
    list.forEach(function(g){
      if(g.w!==prev){
        if(prev!==null) h+='</div>';
        var cls=g.w===cw?' cur':(g.w<cw?' late':'');

function renderVProg(only){

  pool.forEach(function(g){
    if(!by[g.c]){ by[g.c]={n:0,d:0}; order.push(g.c); }
    by[g.c].n++; if(isSeen(g)) by[g.c].d++;

  var h='';
  order.forEach(function(c){
    var o=by[c];
    h+='<span'+(o.d===o.n?' class="done"':'')+'>'+C[c].s+' <b>'+o.d+'/'+o.n+'</b></span>';

  if(optn) h+='<span>출석 무관 <b>'+optn+'</b>개 <small>(미리 체크됨)</small></span>';
  h+='<span class="asof">LMS 출석완료 <b>'+lms+'</b> · 기준 '+(LMS.asof||'—')+'</span>';

     (pr.w!=='—'?'<div class="wgt">'+pr.w+'<small>비중</small></div>':'')+'</div>'+
     '<p class="aim">'+pr.aim+'</p>'+
     '<div class="gcols">'+
     '<div class="gcol"><h4>산출물</h4><ul>'+(pr.out||[]).map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul></div>'+
     '<div class="gcol"><h4>지금 굴려볼 아이디어</h4><ul>'+(pr.idea||[]).map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul></div>'+
     '<div class="gcol"><h4>스스로 점검</h4><ul>'+(pr.ck||[]).map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul></div>'+

     '<div class="memo"><label for="memo-'+k+'">내 아이디어 메모<span class="savemark" id="mk-'+k+'">저장됨</span></label>'+
     '<textarea id="memo-'+k+'" placeholder="이번 주 배운 것 중 프로젝트에 쓸 수 있는 것, 떠오른 주제, 확인할 것…"></textarea>'+
     '<div class="hint">입력하면 자동 저장됩니다.</div></div>'+
     '</div></section>';

  /* 주차별 학습 지도 */
  h+='<section><div class="shead"><h2><span class="idx">'+NW+'W</span>주차별 학습 지도</h2>'+
     '<span class="hint">주차를 눌러 펼치기</span></div><div id="wkmap">';
  (WK[k]||[]).forEach(function(x){ h+=weekRowHTML(k,x,cw); });
  h+='</div>'+
     '<div class="notice" style="margin-top:16px"><b>표시 기준</b> — '+
     '<span class="srcbadge m">자료 확인</span> 실제 강의자료를 읽고 정리한 주차, '+
     '<span class="srcbadge s">계획서 기준</span> 강의계획서·LMS 모듈 제목에서 정리한 주차, '+
     '<span class="srcbadge g">교재 진도 추정</span> 주차 계획이 공개되지 않아 교재 순서로 추정한 주차입니다. 수업 공지가 우선합니다.</div>'+
     '</section>';

  /* 이 과목 마감 전체 */
  var mine=tasksOf(k).filter(function(x){ return !x.tbd; }).sort(function(a,b){ return a.date-b.date; });
  var mtbd=tasksOf(k).filter(function(x){ return x.tbd; });
  h+='<section><div class="shead"><h2><span class="idx">DUE</span>이 과목 제출물 전체</h2>'+
     '<span class="hint">'+mine.length+'건'+(mtbd.length?' + 미정 '+mtbd.length+'건':'')+'</span></div>'+
     '<div class="tasklist" id="ctasks">'+taskListHTML(mine,mtbd,false)+'</div></section>';

  if(vidsOf(k).length) h+=videoSectionHTML(k);
  h+='<footer id="foot"></footer>';
  $('#view').innerHTML=h;

  /* 이벤트 */
  Array.prototype.forEach.call(document.querySelectorAll('.wkhead'),function(b){
    b.addEventListener('click',function(){
      var key=b.dataset.wk;
      openWeeks[key]=!openWeeks[key];
      var row=b.parentNode;
      row.classList.toggle('open',!!openWeeks[key]);
      b.setAttribute('aria-expanded',openWeeks[key]?'true':'false');
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chk[data-wd]'),function(el){
    el.addEventListener('change',function(){
      var key=el.dataset.wd;
      if(el.checked) ST.wdone[key]=1; else delete ST.wdone[key];
      save();
      var mark=el.closest('.wkrow').querySelector('.wkdone');
      var wr=el.closest('.wkrow').querySelector('.wr');
      if(el.checked && !mark && wr) wr.insertAdjacentHTML('afterbegin','<span class="wkdone">학습 완료</span>');
      if(!el.checked && mark) mark.remove();
    });
  });
  wireChecks('#view',null);
  var ta=$('#memo-'+k);
  if(ta){
    ta.value=ST.notes[k]||'';
    var mk=$('#mk-'+k), mkT=null;
    ta.addEventListener('input',function(){
      ST.notes[k]=ta.value; save();
      if(mk){ mk.classList.add('on'); clearTimeout(mkT); mkT=setTimeout(function(){ mk.classList.remove('on'); },1400); }
    });
  }
  if(vidsOf(k).length){ renderVideos('#vidlist',k); wireVidFilters('#vidlist',k); }
  renderFoot();

  showWeek(k,vw,true);
}

/* ===== 라우터 ===== */
function parseRoute(){
  var hash=(location.hash||'').replace(/^#/,'');
  var m=hash.match(/^\/c\/([a-z]+)(?:\/(\d+))?/);
  if(m && C[m[1]]) return {k:'course',c:m[1],w:m[2]?parseInt(m[2],10):0};
  if(/^\/projects/.test(hash)) return {k:'proj'};
  if(/^\/concepts/.test(hash)) return {k:'con'};
  return {k:'home'};
}
function route(){
  var r=parseRoute();
  renderNav(r);
  if(r.k==='course') viewCourse(r.c,r.w);
  else if(r.k==='con') viewConcepts();
  else if(r.k==='proj') viewProjects();
  else viewHome();
  var sd=$('#side'); if(sd) sd.classList.remove('open');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||e.shiftKey) return;
  var t=e.target||{}, tn=(t.tagName||'').toLowerCase();
  if(tn==='input'||tn==='textarea'||tn==='select'||t.isContentEditable) return;
  if(!VIEWK.c||!$('#nowwrap')) return;
  var d = e.key==='ArrowLeft'?-1 : (e.key==='ArrowRight'?1:0);
  if(!d) return;
  var w=stepWeek(VIEWK.c,VIEWK.w,d); if(!w) return;
  e.preventDefault(); showWeek(VIEWK.c,w);
});
$('#menubtn').addEventListener('click',function(){ $('#side').classList.toggle('open'); });

    '<b>기준일</b> '+d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. ('+DOW[d.getDay()]+')';

/* ===== 로컬 서버 실시간 출석 ===== */
(function(){
  if(typeof fetch!=='function') return;
  fetch('api/attendance.json',{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d||!d.done) return;
      DONE={}; d.done.forEach(function(i){ DONE[i]=1; });
      VIDG.forEach(function(g){ g.lmsDone=g.items.some(function(v){ return DONE[v.i]; }); });
      if(d.asof) LMS.asof=d.asof+(d.cached?'':' · 방금 갱신');
      route();
    })
    .catch(function(){});
})();

/* ===== claude.ai 저장소 연결 (아티팩트에서만 동작) ===== */
(function(){
  if(!(window.claude && typeof window.claude.use==='function')) return;
  window.claude.use('db').then(function(db){
    if(!db) return;
    DBH=db;
    return db.doc('study/state').get().then(function(snap){
      if(snap && snap.exists){
        var r=snap.data()||{};
        if((r.ts||0) > (ST.ts||0)){
          ST={done:r.done||{},seen:r.seen||{},wdone:r.wdone||{},notes:r.notes||{},ts:r.ts||0};
          try{ localStorage.setItem(SBKEY+'state',JSON.stringify(ST)); }catch(e){}
          route();
        }else if((ST.ts||0)>(r.ts||0)) saveNow();
      }else saveNow();
    });
  }).catch(function(){});
})();

route();
})();
